apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-submitter
  namespace: pipeline-training
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-submitter
  namespace: pipeline-training
rules:
  - apiGroups: [kubeflow.org]
    resources: [pytorchjobs]
    verbs: [create, get]
  - apiGroups: [placement.kubernetes-fleet.io]
    resources: [resourceplacements]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-submitter
  namespace: pipeline-training
subjects:
  - kind: ServiceAccount
    name: pipeline-submitter
    namespace: pipeline-training
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipeline-submitter
