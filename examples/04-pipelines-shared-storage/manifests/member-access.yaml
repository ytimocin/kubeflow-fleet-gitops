apiVersion: v1
kind: ServiceAccount
metadata:
  name: blob-observer
  namespace: blob-training
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: blob-observer
  namespace: blob-training
rules:
  - apiGroups: [kubeflow.org]
    resources: [pytorchjobs]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: blob-observer
  namespace: blob-training
subjects:
  - kind: ServiceAccount
    name: blob-observer
    namespace: blob-training
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: blob-observer
