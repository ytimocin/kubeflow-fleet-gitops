apiVersion: v1
kind: Namespace
metadata:
  name: gpu-training
---
apiVersion: placement.kubernetes-fleet.io/v1
kind: ClusterResourcePlacement
metadata:
  name: gpu-training-namespace
spec:
  resourceSelectors:
    - group: ""
      version: v1
      kind: Namespace
      name: gpu-training
      selectionScope: NamespaceOnly
  policy:
    placementType: PickFixed
    clusterNames: [demo-east, demo-west]
