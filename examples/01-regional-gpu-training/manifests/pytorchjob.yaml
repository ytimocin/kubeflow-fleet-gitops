apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: regional-gpu-training
  namespace: gpu-training
spec:
  runPolicy:
    cleanPodPolicy: None
    activeDeadlineSeconds: 900
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: Never
      template:
        metadata:
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          nodeSelector:
            kubernetes.azure.com/accelerator: nvidia
          tolerations:
            - key: sku
              operator: Equal
              value: gpu
              effect: NoSchedule
            - key: kubernetes.azure.com/scalesetpriority
              operator: Equal
              value: spot
              effect: NoSchedule
          containers:
            - name: pytorch
              image: pytorch/pytorch:2.6.0-cuda12.4-cudnn9-runtime
              command: [python, -u, -c]
              args:
                - |
                  import torch
                  assert torch.cuda.is_available(), "A real CUDA GPU is required"
                  torch.manual_seed(7)
                  print(f"GPU={torch.cuda.get_device_name(0)} CUDA={torch.version.cuda}")
                  x = torch.randn(4096, 32, device="cuda")
                  y = x.sum(dim=1, keepdim=True)
                  model = torch.nn.Linear(32, 1).cuda()
                  optimizer = torch.optim.SGD(model.parameters(), lr=0.1)
                  initial = None
                  for epoch in range(40):
                      optimizer.zero_grad()
                      loss = torch.nn.functional.mse_loss(model(x), y)
                      if initial is None:
                          initial = loss.item()
                      loss.backward()
                      optimizer.step()
                      if epoch % 5 == 0:
                          print(f"epoch={epoch} loss={loss.item():.6f}")
                  torch.cuda.synchronize()
                  assert loss.item() < initial / 10
                  print("TRAINING_SUCCEEDED device=cuda; synthetic regression")
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                  nvidia.com/gpu: 1
                limits:
                  cpu: "2"
                  memory: 4Gi
                  nvidia.com/gpu: 1
