apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nvidia-device-plugin
resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/NVIDIA/k8s-device-plugin/v0.20.1/deployments/static/nvidia-device-plugin.yml
patches:
  - target:
      kind: DaemonSet
      name: nvidia-device-plugin-daemonset
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: {kubernetes.azure.com/accelerator: nvidia}
      - op: add
        path: /spec/template/spec/tolerations/-
        value: {key: sku, operator: Equal, value: gpu, effect: NoSchedule}
      - op: add
        path: /spec/template/spec/tolerations/-
        value: {key: kubernetes.azure.com/scalesetpriority, operator: Equal, value: spot, effect: NoSchedule}
